services:
  # --- Django API backend ---
  - type: web
    name: snoocommerce-api
    runtime: python
    rootDir: server
    buildCommand: ./build.sh
    startCommand: gunicorn server.wsgi:application
    envVars:
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_PIXEL_ID
        sync: false
      - key: REDDIT_ACCESS_TOKEN
        sync: false
      - key: REDDIT_PIXEL_ID
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"

  # One Reddit-only runner; five-minute testing cadence; switch this service to daily afterward.
  - type: cron
    name: snoocommerce-browser-traffic
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile.browser
    schedule: "*/5 * * * *"
    envVars:
      - key: REDDIT_TEST_MODE
        value: "rapid"
      - key: REDDIT_TEST_DAILY_UTC
        value: "21:10"
      - key: REDDIT_PIXEL_ID
        value: "a2_ibjroms8g8bo"
      - key: REDDIT_TEST_KDF_PIXEL_ID
        value: "p2_17hhlij2ehubf"
      - key: REDDIT_ACCESS_TOKEN
        sync: false
      - key: REDDIT_FIRST_PIXEL_TOKEN
        sync: false
      - key: REDDIT_TEST_EMAIL
        sync: false

  # --- Vite / React static frontend ---
  - type: web
    name: snoocommerce
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://snoocommerce-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
